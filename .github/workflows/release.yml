name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build, attest, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package release archive and SHA-256 checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/vpsinspect-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="vpsinspect-${TAG}/" -o "$archive" HEAD
          (cd dist && sha256sum "vpsinspect-${TAG}.tar.gz" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vpsinspect-*.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/vpsinspect-${TAG}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "$TAG" \
            --generate-notes
